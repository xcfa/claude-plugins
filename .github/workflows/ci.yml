name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install ruff
      - run: python -m ruff check plugins

  test:
    # Очередь работает на машине пользователя: и в Windows, и в Linux, с Python от 3.9.
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, python: "3.9"}
          - {os: windows-latest, python: "3.13"}
          # для свежей Ubuntu (ubuntu-latest) сборок Python 3.9 уже нет
          - {os: ubuntu-24.04, python: "3.9"}
          - {os: ubuntu-latest, python: "3.13"}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -X utf8 -m unittest discover -s plugins/aiflow/tests
